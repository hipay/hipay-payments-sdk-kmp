# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          # Active targets only (D6): jvm/iosX64/linuxX64 were removed in story 1.1.
          - target: iosSimulatorArm64Test
            os: macos-latest
          - target: testAndroidHostTest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4
    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v4
    - uses: actions/cache@v4
      with:
        path: |
          ~/.konan
        key: ${{ runner.os }}-${{ hashFiles('**/.lock') }}
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    # The iOS tests attach to a RUNNING simulator: they exercise the Keychain, and securityd
    # is unavailable to a standalone-spawned process. A GitHub runner boots none by default,
    # so the build guard fails the task before a single test runs.
    - name: Boot an iOS simulator
      if: runner.os == 'macOS'
      run: |
        UDID=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
        test -n "$UDID" || { echo "No available iPhone simulator on this runner" >&2; exit 1; }
        xcrun simctl boot "$UDID"
        xcrun simctl bootstatus "$UDID" -b
    - name: Build with Gradle
      uses: gradle/gradle-build-action@ce999babab2de1c4b649dc15f0ee67e6246c994f
      with:
        arguments: ${{ matrix.target }}
