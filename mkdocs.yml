site_name: HiPay Payments Mobile SDK
site_description: Integration guides for the HiPay Payments SDK (Kotlin Multiplatform, Android, iOS).
# Built and versioned by GitLab CI on a stable tag, committed to `gh-pages`, mirrored to GitHub,
# served by GitHub Pages. Nothing publishes from GitHub (decision R6).
site_url: https://hipay.github.io/hipay-payments-sdk-kmp/
repo_url: https://github.com/hipay/hipay-payments-sdk-kmp
repo_name: hipay-payments-sdk-kmp
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Switch to dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Switch to light mode }

extra:
  version:
    # Serves one subtree per released version with a selector, so an integrator reads the
    # documentation of the version they pinned. Deployed by `mike` on GA tags only.
    provider: mike
    default: latest

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  # Lets docs/changelog.md include the repository CHANGELOG.md instead of duplicating it.
  - pymdownx.snippets: { base_path: ["."] }

nav:
  - Home: index.md
  - Integration:
      - Android: integration/android.md
      - iOS: integration/ios.md
      - Kotlin / Compose Multiplatform: integration/cmp.md
  - Changelog: changelog.md
