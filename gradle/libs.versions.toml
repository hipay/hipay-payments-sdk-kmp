[versions]
agp = "8.13.0"
kotlin = "2.2.20"
android-minSdk = "24"
android-compileSdk = "36"
vanniktechMavenPublish = "0.34.0"
ktor = "3.3.3"
kotlinx-serialization = "1.9.0"
kotlinx-coroutines = "1.11.0"
# Android Compose card module (:hipaycard) — story 7.1
androidx-compose-bom = "2025.06.01"
# Chrome Custom Tabs — SDK-managed 3DS presentation on Android (:hipaycard, story 11.13).
androidx-browser = "1.8.0"
# Jetpack DataStore (Preferences) — encrypted saved-card blob storage on Android (:hipaycard).
androidx-datastore = "1.1.1"
androidx-test-ext-junit = "1.3.0"
# Espresso/runner pinned forward: Compose ui-test pulls espresso 3.5.0 / runner 1.5.0,
# which crash on recent APIs (InputManager.getInstance removed). The 3.7/1.7 generation
# covers API 34+. Note: Compose ui-test 1.8.3 does not attach the composition on API 37 —
# run the Android UI tests on an API <= 35 emulator (see story 7.1 / Epic 8 CI image pin).
androidx-test-runner = "1.7.0"
androidx-espresso = "3.7.0"
# Compose Multiplatform — ONLY for the optional :hipaycard-cmp module (Epic 10).
# Paired with Kotlin 2.2.20 (compose-compiler plugin is version-locked to Kotlin).
compose-multiplatform = "1.9.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
# Android Compose card module (:hipaycard) — story 7.1. Versions come from the Compose BOM.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-browser = { module = "androidx.browser:browser", version.ref = "androidx-browser" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "androidx-datastore" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-espresso" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
vanniktech-mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "vanniktechMavenPublish" }
# Android Compose card module (:hipaycard) — story 7.1
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Compose Multiplatform Gradle plugin (:hipaycard-cmp only) — Epic 10
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
