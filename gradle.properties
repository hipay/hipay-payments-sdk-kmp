# SDK version: single source of truth. Inherited by every module as project.version;
# the same number is the iOS SPM release tag and the Maven coordinate version.
version=1.0.0
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Allow merchants to call exported suspend functions from any thread
# (default K/N export throws IllegalStateException off the main thread).
kotlin.native.binary.objcExportSuspendFunctionLaunchThreadRestriction=none
