# SDK version: single source of truth (story 8.2). Inherited by every module
# (:hipayfullservice, :hipaycard) as project.version; the same number is the iOS
# SPM release tag. Pre-1.0 = API may move; GA 1.0.0 is cut after the G7 stage proof.
version=0.2.0
#Gradle
org.gradle.jvmargs=-Xmx2048M -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options\="-Xmx2048M"
org.gradle.caching=true
org.gradle.configuration-cache=true
#Kotlin
kotlin.code.style=official
kotlin.js.compiler=ir
#MPP
kotlin.mpp.enableCInteropCommonization=true
#Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Allow merchants to call exported suspend functions from any thread
# (default K/N export throws IllegalStateException off the main thread).
kotlin.native.binary.objcExportSuspendFunctionLaunchThreadRestriction=none
