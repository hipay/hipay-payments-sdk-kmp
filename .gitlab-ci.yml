# Release pipeline — decision R6 (architecture-repos.md, 2026-06-22).
#
# SECRET CUSTODY: all publishing secrets live HERE, in GitLab (internal perimeter),
# NEVER on public GitHub. GitLab signs + publishes to Maven Central, builds the iOS
# XCFramework, and PUSHES the GitHub Release + asset via the GitHub API using a
# GitLab-stored, narrowly-scoped token. GitHub holds NO publishing secrets — it only
# hosts the public mirror + the Releases.
#
# Gate (equivalent of the old GitHub workflow_dispatch + protected environment):
#   - runs ONLY on a SemVer release tag,
#   - `when: manual` → a maintainer starts it explicitly (no auto-publish),
#   - secrets are PROTECTED CI/CD variables (exposed only on protected tags),
#   - the `maven-central` environment is a GitLab Protected Environment with required
#     approvers (Settings → CI/CD → Protected environments).
#
# Required PROTECTED + MASKED CI/CD variables (Settings → CI/CD → Variables):
#   ORG_GRADLE_PROJECT_mavenCentralUsername   Sonatype Central Portal token (user)
#   ORG_GRADLE_PROJECT_mavenCentralPassword   Sonatype Central Portal token (secret)
#   ORG_GRADLE_PROJECT_signingInMemoryKeyId   REQUIRED, not optional: short id (8 hex) of the
#                         signing SUBKEY. SIGNING_KEY_B64 holds a subkey-only export, whose first
#                         key is a `gnu-dummy` stub of the primary with NO private material. Without
#                         this id the signing plugin picks that stub and dies on
#                         "PGPPrivateKey.getPublicKeyPacket() because <parameter1> is null".
#   ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
#   SIGNING_KEY_B64       armored GPG private (release subkey), base64 on ONE line —
#                         GitLab cannot mask a multi-line value; decoded into
#                         ORG_GRADLE_PROJECT_signingInMemoryKey by the publish job
#   GITHUB_TOKEN          group-level: write access to the PUBLIC mirror (Releases + assets)
#   GITHUB_ORGANIZATION   group-level: GitHub org (hipay)
#   GITHUB_PROJECT        monorepo mirror name (hipay-payments-sdk-kmp) — target of the
#                         template's repository_dispatch AND of the companion Release
#   GITHUB_SPM_REPO       owner/repo (SLUG, not a URL — build-release.sh interpolates it
#                         into the binaryTarget download URL) hosting the SPM Release and
#                         the XCFramework asset: the iOS repo, NOT the monorepo.
#                         Value: hipay/hipay-payments-sdk-ios
#
# Runner: macOS (XCFramework + `swift package compute-checksum`) with `gh` + JDK 21
# available. Tag the runner `macos` (adjust to your fleet).
#
# PREREQUISITE, easy to miss: `gh release create --verify-tag` refuses a tag that does not
# exist on the GitHub side. The iOS repo tag (carrying the generated remote Package.swift)
# must be pushed to the GitHub mirror BEFORE this job runs — mirroring is manual (R10).
# See release-procedure.md §4.

# Shared team template (pi-ecommerce/cms/cms-template-ci — "cms" is historical, it is
# transverse). It brings `pre-release` (creates the GitLab milestone) and `release-job`
# (creates the GitLab Release, description = the `## <tag>` section of CHANGELOG.md).
# It also pulls in `trigger-github-workflow`, kept ON for the JIRA linkage it performs before
# its dispatch: it adds the JIRA version link to the GitLab Release description and registers a
# "relatedwork" on the JIRA version. Its final `repository_dispatch` to GITHUB_PROJECT is a
# no-op here — no GitHub Actions workflow listens for it, and our GitHub Release is pushed
# directly by `publish-release` below.
include:
  - project: "pi-ecommerce/cms/cms-template-ci"
    ref: "1.4.0"
    file: "release.yaml"
    inputs:
      template_version: "1.4.0"

# Overrides the template's `workflow:` (which would create a pipeline on EVERY push).
# This project has no build/test stage yet, so anything outside a tag or a release branch
# would produce a jobless pipeline.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_REF_NAME =~ /^(release|hotfix)\/\d+\.\d+\.\d+$/
    - when: never

stages:
  - release

publish-release:
  stage: release
  tags: [macos]
  rules:
    # Release tags only (SemVer); pre-release/RC tags (x.y.z-rc.N) do NOT publish.
    # allow_failure MUST be false: GitLab defaults manual jobs to allow_failure: true, which
    # would report a GREEN pipeline after a failed publish.
    - if: '$CI_COMMIT_TAG =~ /^[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
      allow_failure: false
  environment:
    name: maven-central          # GitLab Protected Environment → required approvers
  variables:
    GIT_DEPTH: "0"
  script:
    # Ordering (same invariant as the reviewed pipeline): Maven Central is IRREVERSIBLE,
    # so it is LAST. Everything reversible (iOS build, validation, GitHub Release+assets)
    # runs first — a failure before the Maven step leaves no half-published release.

    # 1. Build the failure-prone, reversible iOS artifacts first.
    - REPO_SLUG="$GITHUB_SPM_REPO" TAG="$CI_COMMIT_TAG" ./scripts/build-release.sh
    - swift package --package-path build-output-local/spm dump-package > /dev/null

    # 2. Push the GitHub Release + assets via the GitHub API. The token lives in GitLab;
    #    GitHub stores nothing. No --clobber: a re-run on a published tag fails on purpose
    #    (a re-release uses a NEW version — the Maven side is immutable).
    - |
      # Same extraction as the shared template's release-job, so the GitHub Release notes
      # and the GitLab Release description are identical. The match is EXACT on
      # "## <tag>": a heading carrying a date or a title suffix silently yields nothing,
      # hence the emptiness check — an unnoticed empty release note is worse than a
      # failed job, and this stage is still reversible.
      awk -v version="## $CI_COMMIT_TAG" '
        $0 == version {printit=1; next}
        printit && /^## [^#]/ {exit}
        printit
      ' CHANGELOG.md > release_changelog.txt
      if [ ! -s release_changelog.txt ]; then
        echo "CHANGELOG.md has no '## $CI_COMMIT_TAG' section (heading must be exactly that)" >&2
        exit 1
      fi
      cat release_changelog.txt
    - |
      export GH_TOKEN="$GITHUB_TOKEN"
      gh release view "$CI_COMMIT_TAG" --repo "$GITHUB_SPM_REPO" >/dev/null 2>&1 \
        || gh release create "$CI_COMMIT_TAG" --repo "$GITHUB_SPM_REPO" --verify-tag \
             --title "$CI_COMMIT_TAG" --notes-file release_changelog.txt
      gh release upload "$CI_COMMIT_TAG" --repo "$GITHUB_SPM_REPO" \
        build-output-local/spm/HiPayFullservice.xcframework.zip \
        build-output-local/spm/Package.swift \
        build-output-local/spm/checksum.txt
    - |
      # Companion Release on the monorepo: no asset (Android/KMP ship through Maven
      # Central), but it is where those integrators land, and it is what fires
      # .github/workflows/slack-message.yml — that workflow listens for a release
      # published ON ITS OWN repository, so a release only on the iOS repo would post
      # nothing. Start the template's `trigger-github-workflow` job BEFORE this one:
      # it feeds the JIRA payload the Slack workflow reads.
      export GH_TOKEN="$GITHUB_TOKEN"
      SOURCE_REPO="$GITHUB_ORGANIZATION/$GITHUB_PROJECT"
      gh release view "$CI_COMMIT_TAG" --repo "$SOURCE_REPO" >/dev/null 2>&1 \
        || gh release create "$CI_COMMIT_TAG" --repo "$SOURCE_REPO" --verify-tag \
             --title "$CI_COMMIT_TAG" --notes-file release_changelog.txt

    # 3. Maven Central LAST (irreversible) — signed with the GPG release subkey.
    #    The armored key is multi-line, which GitLab cannot mask, so it is stored
    #    base64-encoded on a single line and decoded here into the variable the
    #    publish plugin reads.
    - export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%s' "$SIGNING_KEY_B64" | base64 -d)"
    - ./gradlew publishToMavenCentral --no-configuration-cache
